<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本机测试环境</title><style>body{margin:0;background:#f4f6f3;color:#173e37;font:18px sans-serif;display:grid;place-items:center;min-height:100vh}.card{background:#fff;padding:54px;border:1px solid #dbe4df;border-radius:20px;max-width:680px}small{color:#658579;letter-spacing:3px}h1{font-size:38px}p{color:#59716a;line-height:1.8}textarea{box-sizing:border-box;width:100%;height:110px;border:1px solid #bed0c7;border-radius:8px;padding:16px;font:18px sans-serif}button{margin-top:14px;background:#216b56;color:#fff;padding:13px 20px;border:0;border-radius:8px}#saved{font-size:14px}</style><div class="card"><small>LOCAL BROWSER / TEST MODE</small><h1>你的浏览器环境已运行。</h1><p>这是无代理测试环境。你可以测试中文输入、复制粘贴，以及关闭后重新打开的数据保存。正式使用时，请回到工作台导入机场订阅并绑定节点。</p><textarea id="note" placeholder="在这里输入文字，测试独立保存…"></textarea><button id="save">保存到这个环境</button><p id="saved"></p></div><script>note.value=localStorage.getItem('workbench-note')||'';save.onclick=()=>{localStorage.setItem('workbench-note',note.value);document.cookie='workbench-test='+encodeURIComponent(note.value)+';max-age=86400';saved.textContent='已保存。停止后重新打开这个环境，文字会保留。'};</script></html>
